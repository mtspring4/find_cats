<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Find the Cats! - 猫探しゲーム</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
    <style>
        body {
            background-color: #1a1a1a;
            touch-action: none;
            font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
            margin: 0;
            overflow: hidden;
        }
        .game-screen-layout {
            display: grid;
            grid-template-rows: auto 1fr;
            height: 100vh;
        }
        .header-panel {
            background-color: rgba(255, 255, 255, 0.98);
            border-bottom: 4px solid #fbbf24;
            padding: 8px;
            z-index: 50;
        }
        .viewport {
            width: 100vw;
            height: 100%;
            overflow: hidden;
            position: relative;
            background-color: #262626;
        }
        #panning-layer {
            position: absolute;
            transform-origin: 0 0;
            will-change: transform;
            background-color: #262626;
        }
        #stage-container {
            position: relative;
            display: inline-block;
        }
        #stage-image {
            display: block;
            user-select: none;
            -webkit-user-drag: none;
            max-width: none;
            outline: 2px solid rgba(251, 191, 36, 0.3);
        }

        /* ターゲットプレビュー（枠いっぱいに表示） */
        .target-preview {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 3px solid #fbbf24;
            overflow: hidden;
            background-color: #333;
            flex-shrink: 0;
            position: relative;
        }
        .crop-img {
            position: absolute;
            /* width/heightを大きくして枠を埋める */
            width: 500%; 
            height: 500%;
            object-fit: cover;
            /* object-position はJSで設定 */
        }
        .target-preview.found {
            border-color: #10b981;
            opacity: 0.3;
        }
        .target-preview.found::after {
            content: '✓';
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            background: rgba(16, 185, 129, 0.6);
            z-index: 10;
        }

        /* 発見ポップアップ */
        #found-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            background: white;
            padding: 20px;
            border-radius: 40px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 8px solid #fbbf24;
            min-width: 260px;
        }
        #found-popup.active {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }
        .popup-circle {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            overflow: hidden;
            border: 5px solid #fbbf24;
            background: #fff;
            position: relative;
        }
        .popup-circle img {
            position: absolute;
            width: 800%; /* ポップアップ用により大きくズーム */
            height: 800%;
            object-fit: cover;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        .marker {
            position: absolute;
            width: 60px;
            height: 60px;
            border: 5px solid #ef4444;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10;
            background: rgba(239, 68, 68, 0.1);
        }
    </style>
</head>
<body>

    <!-- ステージ選択 -->
    <div id="start-screen" class="fixed inset-0 flex flex-col items-center justify-center bg-amber-50 z-[100] p-6 text-center overflow-y-auto">
        <div class="max-w-xl w-full bg-white p-8 rounded-[3rem] shadow-2xl border-4 border-amber-200 my-auto">
            <h1 class="text-5xl font-black text-amber-600 mb-2 italic tracking-tighter">Find Cats!</h1>
            <p class="text-gray-500 mb-8 font-bold">ステージをえらんでね</p>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <button onclick="startGame('img/01.PNG')" class="bg-white rounded-3xl border-4 border-amber-100 p-3 hover:border-amber-400 transition-all shadow-md active:scale-95">
                    <div class="aspect-[9/16] rounded-2xl overflow-hidden mb-3">
                        <img src="img/01.PNG" class="w-full h-full object-cover">
                    </div>
                    <span class="block font-black text-amber-700 text-lg">ねこの田舎町</span>
                </button>

                <button onclick="startGame('img/02.PNG')" class="bg-white rounded-3xl border-4 border-amber-100 p-3 hover:border-amber-400 transition-all shadow-md active:scale-95">
                    <div class="aspect-[9/16] rounded-2xl overflow-hidden mb-3">
                        <img src="img/02.PNG" class="w-full h-full object-cover">
                    </div>
                    <span class="block font-black text-amber-700 text-lg">ニャンコパーク</span>
                </button>
            </div>
            <p class="mt-8 text-xs text-gray-400 font-bold">🐾 ピンチで拡大 / スワイプで移動 🐾</p>
        </div>
    </div>

    <!-- ゲーム画面 -->
    <div id="game-screen" class="hidden game-screen-layout">
        <div class="header-panel flex items-center justify-between gap-4">
            <button onclick="location.reload()" class="bg-gray-100 px-4 py-2 rounded-2xl text-sm font-black text-gray-500 shrink-0">◀ メニュー</button>
            <div id="target-container" class="flex gap-3 overflow-x-auto no-scrollbar flex-1 justify-center py-1"></div>
            <div class="bg-amber-100 px-4 py-2 rounded-2xl shrink-0">
                <span id="found-count" class="text-amber-600 font-black text-xl">0</span><span class="text-amber-400 font-black text-xl">/5</span>
            </div>
        </div>

        <div class="viewport" id="viewport">
            <div id="panning-layer">
                <div id="stage-container">
                    <img id="stage-image" src="" alt="Find Map" draggable="false">
                    <div id="marker-layer" class="absolute inset-0 pointer-events-none"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- ポップアップ -->
    <div id="found-popup">
        <div class="popup-circle"><img id="popup-img" src=""></div>
        <div class="text-center">
            <p id="found-text" class="text-xl font-black text-gray-800 leading-tight"></p>
            <p class="text-amber-500 font-black text-2xl mt-1 italic animate-bounce">はっけん！🔍</p>
        </div>
    </div>

    <script>
        const stageData = {
            'img/01.PNG': [
                { x: 44.5, y: 5.6, text: "青い飛行機を操縦するネコ" },
                { x: 13.5, y: 35.8, text: "灯台の窓から見るネコ" },
                { x: 41.1, y: 57.5, text: "リュックで歩くネコ" },
                { x: 86.4, y: 29.8, text: "ハシゴをのぼるネコ" },
                { x: 14.5, y: 71.1, text: "麦わら帽子の農家ネコ" }
            ],
            'img/02.PNG': [
                { x: 65.5, y: 19.5, text: "観覧車を楽しむネコ" },
                { x: 89.5, y: 45.8, text: "お化け屋敷のゆうれいネコ" },
                { x: 14.2, y: 34.2, text: "海賊船のキャプテン" },
                { x: 50.0, y: 64.5, text: "王様のパレード" },
                { x: 69.8, y: 75.2, text: "宇宙飛行士のネコ" }
            ]
        };

        let currentImage = "";
        let foundIndices = new Set();
        let isPopupActive = false;
        
        let transform = { x: 0, y: 0, scale: 1 };
        let baseWidth = 0;
        let baseHeight = 0;
        const SAFE_MARGIN = 40; 

        const panLayer = document.getElementById('panning-layer');
        const view = document.getElementById('viewport');
        const img = document.getElementById('stage-image');
        const foundPopup = document.getElementById('found-popup');

        function startGame(path) {
            currentImage = path;
            img.src = path;
            document.getElementById('popup-img').src = path;
            
            img.onload = () => {
                initGameLayout();
                createTargets(path);
                setupInteractions();
            };

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
        }

        function initGameLayout() {
            const vh = view.clientHeight;
            const vw = view.clientWidth;
            
            const availableHeight = vh - (SAFE_MARGIN * 2);
            const ratio = img.naturalWidth / img.naturalHeight;
            
            baseHeight = availableHeight;
            baseWidth = availableHeight * ratio;
            
            img.style.height = baseHeight + 'px';
            img.style.width = baseWidth + 'px';
            
            panLayer.style.padding = `${SAFE_MARGIN}px`;
            transform.scale = 1;
            
            const totalInitialWidth = baseWidth + (SAFE_MARGIN * 2);
            transform.x = (vw - totalInitialWidth) / 2;
            transform.y = 0;
            
            updateCSS();
        }

        function createTargets(path) {
            const container = document.getElementById('target-container');
            container.innerHTML = '';
            const targets = stageData[path];
            targets.forEach((t, i) => {
                const div = document.createElement('div');
                div.className = 'target-preview';
                div.id = `preview-${i}`;
                
                const cImg = document.createElement('img');
                cImg.className = 'crop-img';
                cImg.src = path;
                // 枠いっぱいに表示するため中央に寄せる
                cImg.style.left = "-200%"; 
                cImg.style.top = "-200%";
                cImg.style.objectPosition = `${t.x}% ${t.y}%`;
                
                div.appendChild(cImg);
                container.appendChild(div);
            });
        }

        function setupInteractions() {
            const mc = new Hammer.Manager(view);
            mc.add(new Hammer.Pan({ threshold: 0, pointers: 0 }));
            mc.add(new Hammer.Pinch({ threshold: 0 })).recognizeWith(mc.get('pan'));
            mc.add(new Hammer.Tap());

            let startX, startY, startScale;

            mc.on("panstart pinchstart", () => {
                startX = transform.x;
                startY = transform.y;
                startScale = transform.scale;
            });

            mc.on("panmove pinchmove", (ev) => {
                if (isPopupActive) return;

                let newScale = startScale * (ev.scale || 1);
                transform.scale = Math.max(1, Math.min(newScale, 3));

                transform.x = startX + ev.deltaX;
                transform.y = startY + ev.deltaY;

                applyBoundaries();
                updateCSS();
            });

            mc.on("tap", (ev) => {
                if (isPopupActive) return;
                const rect = img.getBoundingClientRect(); 
                
                if (ev.center.x >= rect.left && ev.center.x <= rect.right &&
                    ev.center.y >= rect.top && ev.center.y <= rect.bottom) {
                    
                    const xPct = ((ev.center.x - rect.left) / rect.width) * 100;
                    const yPct = ((ev.center.y - rect.top) / rect.height) * 100;
                    checkHit(xPct, yPct);
                }
            });
        }

        function applyBoundaries() {
            const vw = view.clientWidth;
            const vh = view.clientHeight;
            const curW = (baseWidth + SAFE_MARGIN * 2) * transform.scale;
            const curH = (baseHeight + SAFE_MARGIN * 2) * transform.scale;

            if (curW <= vw) {
                transform.x = (vw - curW) / 2;
            } else {
                transform.x = Math.max(Math.min(0, transform.x), vw - curW);
            }

            if (curH <= vh) {
                transform.y = (vh - curH) / 2;
            } else {
                transform.y = Math.max(Math.min(0, transform.y), vh - curH);
            }
        }

        function updateCSS() {
            panLayer.style.transform = `translate(${transform.x}px, ${transform.y}px) scale(${transform.scale})`;
        }

        function checkHit(x, y) {
            const targets = stageData[currentImage];
            targets.forEach((target, i) => {
                if (foundIndices.has(i)) return;
                const dist = Math.sqrt(Math.pow(x - target.x, 2) + Math.pow(y - target.y, 2));
                if (dist < 4) {
                    foundIndices.add(i);
                    addMarker(target.x, target.y);
                    document.getElementById(`preview-${i}`).classList.add('found');
                    document.getElementById('found-count').textContent = foundIndices.size;
                    showPopup(target);
                }
            });
        }

        function addMarker(x, y) {
            const m = document.createElement('div');
            m.className = 'marker';
            m.style.left = x + '%';
            m.style.top = y + '%';
            document.getElementById('marker-layer').appendChild(m);
        }

        function showPopup(t) {
            isPopupActive = true;
            document.getElementById('found-text').textContent = t.text;
            const pImg = document.getElementById('popup-img');
            
            // ポップアップ用ズーム（枠全体を埋める）
            pImg.style.left = "-350%"; 
            pImg.style.top = "-350%";
            pImg.style.objectPosition = `${t.x}% ${t.y}%`;
            
            foundPopup.classList.add('active');
            setTimeout(() => {
                foundPopup.classList.remove('active');
                isPopupActive = false;
                if(foundIndices.size === 5) {
                    setTimeout(() => {
                        const finalClear = document.createElement('div');
                        finalClear.className = "fixed inset-0 bg-white/95 z-[2000] flex flex-col items-center justify-center p-10 text-center";
                        finalClear.innerHTML = `
                            <div class="text-9xl mb-6">🎉</div>
                            <h2 class="text-5xl font-black text-amber-600 mb-4 italic">STAGE CLEAR!</h2>
                            <p class="text-xl font-bold text-gray-500 mb-10">すべてのネコを見つけたね！</p>
                            <button onclick="location.reload()" class="bg-amber-500 text-white font-black text-2xl py-6 px-12 rounded-[2.5rem] shadow-2xl active:scale-95 transition-transform">メニューへもどる</button>
                        `;
                        document.body.appendChild(finalClear);
                    }, 500);
                }
            }, 2000);
        }
    </script>
</body>
</html>
