<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find the Cats! - 猫探しゲーム</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #1a1a1a;
            touch-action: manipulation;
            font-family: sans-serif;
            margin: 0;
            overflow: hidden;
        }
        .game-screen-layout {
            display: grid;
            grid-template-rows: auto 1fr;
            height: 100vh;
        }
        .header-panel {
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            border-bottom: 2px solid #fbbf24;
            padding: 10px;
            z-index: 50;
        }
        .game-container {
            position: relative;
            overflow: auto;
            width: 100%;
            height: 100%;
            background-color: #262626;
            cursor: crosshair;
        }
        .game-image {
            display: block;
            min-width: 2000px; /* 初期表示を大きく */
            height: auto;
            user-select: none;
            -webkit-user-drag: none;
        }
        .marker {
            position: absolute;
            width: 80px;
            height: 80px;
            border: 6px solid #ef4444;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.6);
            animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes bounceIn {
            from { transform: translate(-50%, -50%) scale(0); }
            to { transform: translate(-50%, -50%) scale(1); }
        }
        /* ターゲットプレビューのスタイル */
        .target-preview {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid #fbbf24;
            overflow: hidden;
            position: relative;
            background-color: #eee;
            transition: all 0.3s;
        }
        .target-preview img {
            position: absolute;
            /* ターゲット座標に合わせてJSで調整 */
            max-width: none; 
        }
        .target-preview.found {
            border-color: #10b981;
            filter: grayscale(100%);
            opacity: 0.4;
        }
        .target-preview.found::after {
            content: '✅';
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            background: rgba(0,0,0,0.2);
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <!-- スタート画面 -->
    <div id="start-screen" class="fixed inset-0 flex items-center justify-center bg-amber-50 z-[100] p-6">
        <div class="max-w-md w-full bg-white p-10 rounded-[3rem] shadow-2xl border-8 border-amber-200 text-center">
            <h1 class="text-5xl font-black text-amber-600 mb-4 tracking-tighter">Find Cats!</h1>
            <p class="text-gray-500 mb-8 font-bold">5匹の特別なネコをさがしてね</p>
            
            <button onclick="startGame('img/01.PNG')" 
                class="w-full group overflow-hidden rounded-3xl border-4 border-amber-400 hover:bg-amber-400 transition-all p-4 bg-white shadow-xl">
                <div class="aspect-video bg-gray-100 rounded-xl mb-4 overflow-hidden border">
                    <img src="img/01.PNG" alt="Stage 1" class="w-full h-full object-cover">
                </div>
                <span class="font-bold text-2xl text-amber-800 group-hover:text-white transition-colors">スタート！</span>
            </button>
        </div>
    </div>

    <!-- ゲーム画面 -->
    <div id="game-screen" class="hidden game-screen-layout">
        
        <!-- ヘッダー：ターゲット画像リスト -->
        <div class="header-panel shadow-lg">
            <div class="max-w-6xl mx-auto flex items-center justify-between gap-4">
                <button onclick="backToMenu()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-2 px-4 rounded-xl text-xs transition shrink-0">
                    戻る
                </button>
                
                <div class="flex items-center gap-3 overflow-x-auto no-scrollbar py-1">
                    <span class="text-xs font-black text-amber-600 bg-amber-100 px-2 py-1 rounded">さがすもの:</span>
                    <div id="target-container" class="flex gap-3">
                        <!-- ここにターゲットの丸い切り抜き画像が入る -->
                    </div>
                </div>

                <div class="flex items-center gap-2 shrink-0 bg-gray-100 p-2 rounded-xl">
                    <span class="text-[10px] font-bold text-gray-400 uppercase">Zoom</span>
                    <input type="range" min="1000" max="5000" value="2500" 
                        class="w-20 h-1.5 bg-gray-300 rounded-lg appearance-none cursor-pointer accent-amber-500" 
                        oninput="adjustZoom(this.value)">
                </div>
            </div>
        </div>

        <!-- メイン：画像探索エリア -->
        <div class="game-container" id="game-container">
            <div id="image-wrapper" class="relative inline-block">
                <img id="stage-image" src="" alt="World Map" class="game-image" onclick="handleImageClick(event)" draggable="false">
                <div id="marker-layer" class="absolute inset-0 pointer-events-none"></div>
            </div>
        </div>
    </div>

    <!-- クリア演出 -->
    <div id="clear-modal" class="fixed inset-0 bg-black/80 hidden z-[200] flex items-center justify-center p-6">
        <div class="bg-white rounded-[3rem] p-10 text-center max-w-sm animate-bounce">
            <div class="text-6xl mb-4">🏆</div>
            <h2 class="text-3xl font-black text-gray-800 mb-2">コンプリート！</h2>
            <p class="text-gray-500 mb-6 font-bold">すべてのネコを見つけたね！</p>
            <button onclick="backToMenu()" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-black py-4 rounded-2xl text-xl shadow-lg transition">
                おわる
            </button>
        </div>
    </div>

    <script>
        // ステージごとのターゲット座標 (1ステージ5個)
        // x, y は画像全体に対する%
        const stageData = {
            'img/01.PNG': [
                { x: 44.5, y: 5.6 },  // 飛行機
                { x: 13.5, y: 35.8 }, // 灯台
                { x: 41.1, y: 57.5 }, // リュック歩き
                { x: 86.4, y: 29.8 }, // ツリーハウス
                { x: 14.5, y: 71.1 }  // 農夫
            ]
        };

        let currentImage = "";
        let foundIndices = new Set();

        const startScreen = document.getElementById('start-screen');
        const gameScreen = document.getElementById('game-screen');
        const stageImage = document.getElementById('stage-image');
        const markerLayer = document.getElementById('marker-layer');
        const targetContainer = document.getElementById('target-container');
        const clearModal = document.getElementById('clear-modal');
        const container = document.getElementById('game-container');

        function startGame(path) {
            currentImage = path;
            foundIndices.clear();
            markerLayer.innerHTML = '';
            targetContainer.innerHTML = '';
            clearModal.classList.add('hidden');
            
            stageImage.src = path;
            
            // ターゲットプレビュー（切り抜き）の生成
            const targets = stageData[path] || [];
            targets.forEach((t, i) => {
                const div = document.createElement('div');
                div.className = 'target-preview';
                div.id = `preview-${i}`;
                
                // 切り抜き表示用のimg
                const img = document.createElement('img');
                img.src = path;
                
                // 画像が読み込まれてから位置を合わせる
                img.onload = function() {
                    const scale = 400; // 切り抜き内のズーム倍率
                    img.style.width = scale + '%';
                    img.style.left = (-t.x * (scale/100) + 7.5) + '%'; // 7.5は表示枠(60px)の調整
                    img.style.top = (-t.y * (scale/100) + 7.5) + '%';
                };
                
                div.appendChild(img);
                targetContainer.appendChild(div);
            });

            startScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            
            // 少し待ってから中央へスクロール
            setTimeout(() => {
                container.scrollLeft = (stageImage.width - container.clientWidth) / 2;
                container.scrollTop = (stageImage.height - container.clientHeight) / 2;
            }, 100);
        }

        function backToMenu() {
            startScreen.classList.remove('hidden');
            gameScreen.classList.add('hidden');
            clearModal.classList.add('hidden');
        }

        function adjustZoom(val) {
            stageImage.style.minWidth = val + 'px';
        }

        function handleImageClick(e) {
            const rect = stageImage.getBoundingClientRect();
            const xPercent = ((e.clientX - rect.left) / rect.width) * 100;
            const yPercent = ((e.clientY - rect.top) / rect.height) * 100;

            const targets = stageData[currentImage] || [];
            let foundAny = false;

            targets.forEach((target, index) => {
                if (foundIndices.has(index)) return;

                const dx = Math.abs(xPercent - target.x);
                const dy = Math.abs(yPercent - target.y);
                
                // 判定距離（ズーム状況に合わせて微調整可能）
                if (dx < 2.5 && dy < 2.5) { 
                    addMarker(target.x, target.y);
                    foundIndices.add(index);
                    document.getElementById(`preview-${index}`).classList.add('found');
                    foundAny = true;
                }
            });

            if (foundAny && foundIndices.size === targets.length) {
                setTimeout(() => clearModal.classList.remove('hidden'), 800);
            }
        }

        function addMarker(x, y) {
            const marker = document.createElement('div');
            marker.className = 'marker';
            marker.style.left = x + '%';
            marker.style.top = y + '%';
            markerLayer.appendChild(marker);
        }
    </script>
</body>
</html>
