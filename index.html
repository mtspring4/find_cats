<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find the Cats! - 猫探しゲーム</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #fefce8;
            touch-action: manipulation;
            font-family: sans-serif;
        }
        .game-container {
            position: relative;
            overflow: auto;
            max-width: 100%;
            max-height: 75vh;
            border: 8px solid #fbbf24;
            border-radius: 20px;
            background-color: #f3f4f6;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }
        .game-image {
            display: block;
            min-width: 1200px;
            height: auto;
            cursor: crosshair;
            user-select: none;
            -webkit-user-drag: none;
        }
        .marker {
            position: absolute;
            width: 50px;
            height: 50px;
            border: 5px solid #ef4444;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10;
        }
        .marker::after {
            content: '🐾';
            position: absolute;
            top: -25px;
            right: -15px;
            font-size: 20px;
        }
    </style>
</head>
<body class="flex flex-col items-center p-4 min-h-screen">

    <header class="text-center mb-6">
        <h1 class="text-4xl font-black text-amber-600 mb-2">Find the Cats! 😺</h1>
        <p class="text-gray-600">隠れているネコたちを全部見つけよう！</p>
    </header>

    <!-- Start Screen: Stage Selection -->
    <div id="start-screen" class="w-full max-w-3xl bg-white p-8 rounded-3xl shadow-xl border-4 border-amber-100">
        <h2 class="text-2xl font-bold mb-6 text-center text-gray-700">ステージを選択</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            
            <button onclick="startGame('./img/01.PNG', 'にぎやかな町')" 
                class="group relative overflow-hidden rounded-2xl border-4 border-transparent hover:border-amber-400 transition-all bg-amber-50 p-3 shadow-sm hover:shadow-md">
                <div class="aspect-video bg-gray-200 rounded-lg mb-3 overflow-hidden flex items-center justify-center">
                    <img src="./img/01.PNG" alt="Stage 1 Preview" 
                         onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"
                         class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500">
                    <div class="hidden text-gray-400 text-xs p-2">画像が見つかりません<br>(img/01.PNG)</div>
                </div>
                <div class="font-bold text-lg text-amber-800">Stage 1: にぎやかな町</div>
                <div class="text-sm text-amber-600 text-left">難易度: ★☆☆</div>
            </button>

        </div>
    </div>

    <!-- Game Play Screen -->
    <div id="game-screen" class="hidden w-full max-w-6xl flex flex-col items-center">
        <div class="w-full flex flex-wrap justify-between items-center gap-4 mb-4 bg-white p-4 rounded-2xl shadow-sm border border-amber-100">
            <button onclick="backToMenu()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-2 px-6 rounded-xl transition">
                🔙 メニューに戻る
            </button>
            
            <div class="flex items-center gap-4 bg-amber-50 px-4 py-2 rounded-xl">
                <span class="font-bold text-amber-800">ズーム:</span>
                <input type="range" min="600" max="3000" value="1200" 
                    class="h-2 bg-amber-200 rounded-lg appearance-none cursor-pointer accent-amber-500" 
                    oninput="adjustZoom(this.value)">
            </div>

            <div class="font-bold text-lg text-amber-700 bg-white border-2 border-amber-400 px-4 py-1 rounded-full">
                見つけた数: <span id="found-count">0</span> / <span id="total-count">0</span>
            </div>
        </div>

        <div class="game-container" id="game-container">
            <div id="image-wrapper" class="relative inline-block">
                <img id="stage-image" src="" alt="Game Board" class="game-image" 
                     onclick="checkClick(event)" draggable="false"
                     onerror="handleImageError()">
                <div id="marker-layer" class="absolute inset-0 pointer-events-none"></div>
            </div>
        </div>

        <div id="error-message" class="hidden mt-4 p-4 bg-red-100 text-red-700 rounded-xl">
            画像ファイルが見つかりません。フォルダ名が「img」で、その中に「01.PNG」があるか確認してください。
        </div>
    </div>

    <!-- Success Toast -->
    <div id="toast" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 scale-0 opacity-0 bg-white text-amber-600 px-10 py-5 rounded-full text-3xl font-black shadow-2xl z-50 transition-all duration-300 pointer-events-none border-4 border-amber-400">
        見つけた！ 🐱✨
    </div>

    <script>
        // Data for each image
        const stageData = {
            './img/01.PNG': [
                { x: 44.5, y: 5.6, name: "Airplane Cat" },
                { x: 13.5, y: 35.8, name: "Lighthouse Cat" },
                { x: 41.1, y: 57.5, name: "Walking Cat" },
                { x: 86.4, y: 29.8, name: "Treehouse Cat" },
                { x: 14.5, y: 71.1, name: "Farmer Cat" },
                { x: 89.2, y: 88.3, name: "Tent Cat" },
                { x: 57.1, y: 22.8, name: "Beach Cat" }
            ]
        };

        let currentImage = "";
        let foundIndices = new Set();

        const startScreen = document.getElementById('start-screen');
        const gameScreen = document.getElementById('game-screen');
        const stageImage = document.getElementById('stage-image');
        const markerLayer = document.getElementById('marker-layer');
        const foundCountSpan = document.getElementById('found-count');
        const totalCountSpan = document.getElementById('total-count');
        const toast = document.getElementById('toast');
        const errorMsg = document.getElementById('error-message');

        function startGame(path, title) {
            currentImage = path;
            foundIndices.clear();
            markerLayer.innerHTML = '';
            errorMsg.classList.add('hidden');
            stageImage.style.display = 'block';
            
            stageImage.src = path;
            
            const targets = stageData[path] || [];
            foundCountSpan.textContent = "0";
            totalCountSpan.textContent = targets.length;

            startScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
        }

        function handleImageError() {
            errorMsg.classList.remove('hidden');
            stageImage.style.display = 'none';
        }

        function backToMenu() {
            startScreen.classList.remove('hidden');
            gameScreen.classList.add('hidden');
        }

        function adjustZoom(val) {
            stageImage.style.minWidth = val + 'px';
        }

        function checkClick(e) {
            const rect = stageImage.getBoundingClientRect();
            const xPercent = ((e.clientX - rect.left) / rect.width) * 100;
            const yPercent = ((e.clientY - rect.top) / rect.height) * 100;

            // Log coordinates for development
            console.log(`{ x: ${xPercent.toFixed(1)}, y: ${yPercent.toFixed(1)}, name: "New Cat" }`);

            const targets = stageData[currentImage] || [];
            let isCorrect = false;

            targets.forEach((target, index) => {
                if (foundIndices.has(index)) return;
                const distance = Math.sqrt(Math.pow(xPercent - target.x, 2) + Math.pow(yPercent - target.y, 2));
                if (distance < 3.0) { 
                    addMarker(target.x, target.y);
                    foundIndices.add(index);
                    isCorrect = true;
                }
            });

            if (isCorrect) {
                updateProgress();
                showToast();
            }
        }

        function addMarker(x, y) {
            const marker = document.createElement('div');
            marker.className = 'marker';
            marker.style.left = x + '%';
            marker.style.top = y + '%';
            markerLayer.appendChild(marker);
        }

        function updateProgress() {
            foundCountSpan.textContent = foundIndices.size;
            const targets = stageData[currentImage] || [];
            if (foundIndices.size === targets.length && targets.length > 0) {
                setTimeout(() => alert("おめでとう！全部見つけたよ！🎉"), 500);
            }
        }

        function showToast() {
            toast.classList.remove('scale-0', 'opacity-0');
            toast.classList.add('scale-100', 'opacity-100');
            setTimeout(() => {
                toast.classList.remove('scale-100', 'opacity-100');
                toast.classList.add('scale-0', 'opacity-0');
            }, 1000);
        }
    </script>
</body>
</html>
