<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Find the Cats! - 猫探しゲーム</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
    <style>
        body {
            background-color: #1a1a1a;
            touch-action: none;
            font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
            margin: 0;
            overflow: hidden;
        }
        .game-screen-layout {
            display: grid;
            grid-template-rows: auto 1fr;
            height: 100vh;
        }
        .header-panel {
            background-color: rgba(255, 255, 255, 0.98);
            border-bottom: 4px solid #fbbf24;
            padding: 8px;
            z-index: 50;
        }
        .viewport {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
            background-color: #262626;
        }
        #panning-layer {
            position: absolute;
            transform-origin: 0 0;
            will-change: transform;
        }
        #stage-image {
            display: block;
            height: 100%; /* 初期状態は高さ100% */
            width: auto;
            user-select: none;
            -webkit-user-drag: none;
        }
        /* ターゲットプレビュー */
        .target-preview {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 3px solid #fbbf24;
            overflow: hidden;
            position: relative;
            background-color: #333;
            flex-shrink: 0;
        }
        .crop-img {
            position: absolute;
            width: 1000%; /* かなり大きくズームして切り抜く */
            max-width: none;
            transform: translate(-50%, -50%);
            top: 50%;
            left: 50%;
        }
        .target-preview.found {
            border-color: #10b981;
            opacity: 0.3;
        }
        .target-preview.found::after {
            content: '✓';
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            background: rgba(16, 185, 129, 0.6);
        }

        /* 発見ポップアップ */
        #found-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            background: white;
            padding: 20px;
            border-radius: 30px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 6px solid #fbbf24;
        }
        #found-popup.active {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }
        .popup-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            overflow: hidden;
            position: relative;
            border: 4px solid #fbbf24;
        }
        .popup-circle img {
            position: absolute;
            width: 1000%;
            max-width: none;
            transform: translate(-50%, -50%);
            top: 50%;
            left: 50%;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <!-- スタート画面 -->
    <div id="start-screen" class="fixed inset-0 flex items-center justify-center bg-amber-50 z-[100] p-6 text-center">
        <div class="max-w-md w-full bg-white p-8 rounded-[2.5rem] shadow-2xl border-4 border-amber-200">
            <h1 class="text-4xl font-black text-amber-600 mb-2 italic">Find Cats!</h1>
            <p class="text-gray-500 mb-6 font-bold">5匹のネコをさがしてね</p>
            <button onclick="startGame('img/01.PNG')" class="w-full rounded-2xl p-4 bg-amber-500 text-white font-bold text-xl shadow-lg hover:bg-amber-600 transition">
                スタート！
            </button>
        </div>
    </div>

    <!-- ゲーム画面 -->
    <div id="game-screen" class="hidden game-screen-layout">
        <div class="header-panel flex items-center justify-between gap-2">
            <button onclick="location.reload()" class="bg-gray-100 p-2 rounded-lg text-xs font-bold text-gray-600 shrink-0">◀戻る</button>
            <div id="target-container" class="flex gap-2 overflow-x-auto no-scrollbar flex-1 justify-center py-1"></div>
            <div class="text-amber-500 font-black text-lg px-2 shrink-0"><span id="found-count">0</span>/5</div>
        </div>

        <div class="viewport" id="viewport">
            <div id="panning-layer">
                <img id="stage-image" src="" alt="Find Map" draggable="false">
                <div id="marker-layer" class="absolute inset-0 pointer-events-none"></div>
            </div>
        </div>
    </div>

    <!-- ポップアップ -->
    <div id="found-popup">
        <div class="popup-circle"><img id="popup-img" src=""></div>
        <div class="text-center">
            <p id="found-text" class="text-lg font-black text-gray-800"></p>
            <p class="text-amber-500 font-bold text-xl italic">はっけん！🔍</p>
        </div>
    </div>

    <script>
        const stageData = {
            'img/01.PNG': [
                { x: 44.5, y: 5.6, text: "飛行機を操縦するネコ" },
                { x: 13.5, y: 35.8, text: "灯台の窓から見るネコ" },
                { x: 41.1, y: 57.5, text: "リュックで歩くネコ" },
                { x: 86.4, y: 29.8, text: "ハシゴをのぼるネコ" },
                { x: 14.5, y: 71.1, text: "農家のネコ" }
            ]
        };

        let currentImage = "";
        let foundIndices = new Set();
        let isPopupActive = false;
        
        // 座標とズームの状態
        let transform = { x: 0, y: 0, scale: 1 };
        let baseWidth = 0;
        let baseHeight = 0;

        const panLayer = document.getElementById('panning-layer');
        const view = document.getElementById('viewport');
        const img = document.getElementById('stage-image');
        const foundPopup = document.getElementById('found-popup');

        function startGame(path) {
            currentImage = path;
            img.src = path;
            document.getElementById('popup-img').src = path;
            
            img.onload = () => {
                initGameLayout();
                createTargets(path);
                setupInteractions();
            };

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
        }

        function initGameLayout() {
            // 画像の「高さ」を画面の高さに合わせる
            const vh = view.clientHeight;
            const vw = view.clientWidth;
            
            // 画像本来の比率から、高さ100%にした時の幅を計算
            const ratio = img.naturalWidth / img.naturalHeight;
            baseHeight = vh;
            baseWidth = vh * ratio;
            
            img.style.height = baseHeight + 'px';
            img.style.width = baseWidth + 'px';
            
            // 初期状態：中央寄せ（幅が画面より広い場合）
            transform.scale = 1;
            transform.x = Math.min(0, (vw - baseWidth) / 2);
            transform.y = 0;
            
            updateCSS();
        }

        function createTargets(path) {
            const container = document.getElementById('target-container');
            const targets = stageData[path];
            targets.forEach((t, i) => {
                const div = document.createElement('div');
                div.className = 'target-preview';
                div.id = `preview-${i}`;
                const cImg = document.createElement('img');
                cImg.className = 'crop-img';
                cImg.src = path;
                // ネコが中央に来るように座標を反転
                cImg.style.marginLeft = (50 - t.x) * 10 + '%'; 
                cImg.style.marginTop = (50 - t.y) * 10 + '%';
                div.appendChild(cImg);
                container.appendChild(div);
            });
        }

        function setupInteractions() {
            const mc = new Hammer.Manager(view);
            mc.add(new Hammer.Pan({ threshold: 0, pointers: 0 }));
            mc.add(new Hammer.Pinch({ threshold: 0 })).recognizeWith(mc.get('pan'));
            mc.add(new Hammer.Tap());

            let startX, startY, startScale;

            mc.on("panstart pinchstart", () => {
                startX = transform.x;
                startY = transform.y;
                startScale = transform.scale;
            });

            mc.on("panmove pinchmove", (ev) => {
                if (isPopupActive) return;

                // スケール計算 (1倍〜2倍)
                let newScale = startScale * (ev.scale || 1);
                transform.scale = Math.max(1, Math.min(newScale, 2));

                // 移動計算
                transform.x = startX + ev.deltaX;
                transform.y = startY + ev.deltaY;

                applyBoundaries();
                updateCSS();
            });

            mc.on("tap", (ev) => {
                if (isPopupActive) return;
                const rect = panLayer.getBoundingClientRect();
                const xPct = ((ev.center.x - rect.left) / rect.width) * 100;
                const yPct = ((ev.center.y - rect.top) / rect.height) * 100;
                checkHit(xPct, yPct);
            });
        }

        function applyBoundaries() {
            const vw = view.clientWidth;
            const vh = view.clientHeight;
            const curW = baseWidth * transform.scale;
            const curH = baseHeight * transform.scale;

            // X軸の制限
            if (curW <= vw) {
                transform.x = (vw - curW) / 2; // 画面より小さい時は中央
            } else {
                transform.x = Math.max(Math.min(0, transform.x), vw - curW);
            }

            // Y軸の制限
            if (curH <= vh) {
                transform.y = (vh - curH) / 2;
            } else {
                transform.y = Math.max(Math.min(0, transform.y), vh - curH);
            }
        }

        function updateCSS() {
            panLayer.style.transform = `translate(${transform.x}px, ${transform.y}px) scale(${transform.scale})`;
        }

        function checkHit(x, y) {
            const targets = stageData[currentImage];
            targets.forEach((target, i) => {
                if (foundIndices.has(i)) return;
                const dist = Math.sqrt(Math.pow(x - target.x, 2) + Math.pow(y - target.y, 2));
                if (dist < 3.5) {
                    foundIndices.add(i);
                    addMarker(target.x, target.y);
                    document.getElementById(`preview-${i}`).classList.add('found');
                    document.getElementById('found-count').textContent = foundIndices.size;
                    showPopup(target);
                }
            });
        }

        function addMarker(x, y) {
            const m = document.createElement('div');
            m.className = 'marker';
            m.style.left = x + '%';
            m.style.top = y + '%';
            document.getElementById('marker-layer').appendChild(m);
        }

        function showPopup(t) {
            isPopupActive = true;
            document.getElementById('found-text').textContent = t.text;
            const pImg = document.getElementById('popup-img');
            pImg.style.marginLeft = (50 - t.x) * 10 + '%';
            pImg.style.marginTop = (50 - t.y) * 10 + '%';
            
            foundPopup.classList.add('active');
            setTimeout(() => {
                foundPopup.classList.remove('active');
                isPopupActive = false;
                if(foundIndices.size === 5) {
                    setTimeout(() => alert("クリア！おめでとう！"), 500);
                }
            }, 2000);
        }
    </script>
</body>
</html>
